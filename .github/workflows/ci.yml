name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

  workflow_call:



jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-3
      STRIPE_PRIVATE_API_KEY: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_STRIPE_PRIVATE_API_KEY ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_STRIPE_PRIVATE_API_KEY ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_STRIPE_PRIVATE_API_KEY ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_STRIPE_PRIVATE_API_KEY
              }}
      GOOGLE_GEOCODE_API_KEY: ${{
              (github.event_name == 'pull_request' && github.base_ref == 'prod') && secrets.PROD_GOOGLE_GEOCODE_API_KEY ||
              (github.event_name == 'pull_request' && github.base_ref == 'preprod') && secrets.PREPROD_GOOGLE_GEOCODE_API_KEY ||
              (github.ref == 'refs/heads/prod') && secrets.PROD_GOOGLE_GEOCODE_API_KEY ||
              (github.ref == 'refs/heads/preprod') && secrets.PREPROD_GOOGLE_GEOCODE_API_KEY
              }}


    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'
      - run: chmod +x gradlew
      - run: chmod +x .shell/publish_gen_to_maven_local.sh
      - run: |
          ./gradlew test \
            -Dstripe.private.api.key="$STRIPE_PRIVATE_API_KEY" \
            -Dgoogle.geocode.api.key="$GOOGLE_GEOCODE_API_KEY"

      

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x format.sh
      - run: ./format.sh && git diff --exit-code