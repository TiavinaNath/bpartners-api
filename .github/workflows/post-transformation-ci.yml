name: POJA Import CI

on:
  push:
    branches:
      - import-252fa4d9-b9f8-415d-ac06-19638177827d-post-transformation
env:
  ORG_ID: d3aa5c20-aba0-4f7f-89f8-320c156a75d0
  IMPORT_ID: 252fa4d9-b9f8-415d-ac06-19638177827d

jobs:
  post-transformation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_GEOCODE_API_KEY: ${{ secrets.TEST_GOOGLE_GEOCODE_API_KEY }}
      STRIPE_PRIVATE_API_KEY: ${{ secrets.TEST_STRIPE_PRIVATE_API_KEY }}

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run tests and capture outcome
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          set +e

          chmod +x gradlew
          ./gradlew test --info

          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "outcome=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "outcome=FAILURE" >> $GITHUB_OUTPUT
          fi

      - name: Update import state
        run: |
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")

          curl --fail -X POST "https://api.preprod.poja.io/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/states" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg job_name "POST_TRANSFORMATION_TEST" \
                  --arg job_status "${{ steps.test.outputs.outcome }}" \
                  --arg run_id "${{ github.run_id }}" \
                  --arg attempt_nb "${{ github.run_attempt }}" \
                  --arg repo_owner "${{ github.repository_owner }}" \
                  --arg repo_name "$REPO_NAME" \
                  '{ job_name: $job_name, job_status: $job_status, run_id: $run_id, attempt_nb: $attempt_nb, repo_owner: $repo_owner, repo_name: $repo_name }')"